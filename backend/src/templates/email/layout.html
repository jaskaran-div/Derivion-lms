<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light">
  <title>{{appName}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;-webkit-text-size-adjust:100%;">
  <!-- Preheader: the preview line shown next to the subject in the inbox -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f4f6;font-size:1px;line-height:1px;">{{preheader}}&#8203;&zwnj;&#8203;&zwnj;&#8203;&zwnj;&#8203;&zwnj;</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
          <tr>
            <td style="background-color:#0f1b3d;border-radius:12px 12px 0 0;padding:24px 32px 22px;text-align:center;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              <a href="{{homeUrl}}" target="_blank" style="text-decoration:none;color:#ffffff;">
                <img src="{{logoUrl}}" alt="{{appName}}" width="170" height="32" style="display:block;margin:0 auto;width:170px;height:auto;max-width:170px;border:0;outline:none;font-size:20px;line-height:1.2;font-weight:700;color:#ffffff;">
              </a>
              <div style="margin-top:4px;font-size:11px;line-height:1.3;letter-spacing:1.6px;text-transform:uppercase;color:#93a4c8;">Learning Hub</div>
            </td>
          </tr>
          <tr><td style="background-color:#1d4ed8;height:4px;line-height:4px;font-size:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:34px 32px 26px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.65;color:#374151;">
              {{{content}}}
            </td>
          </tr>
          <tr>
            <td style="background-color:#f9fafb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;padding:20px 32px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6b7280;text-align:center;">
              {{reason}}<br>
              {{{supportLine}}}
              <div style="margin-top:8px;color:#9ca3af;">&copy; {{year}} {{appName}}. All rights reserved.</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
