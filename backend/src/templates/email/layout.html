<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f5f8;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:600px;margin:32px auto;background:#ffffff;border-radius:14px;overflow:hidden;">
    <div style="background:#0f1115;padding:26px;text-align:center;color:#ffffff;font-size:20px;font-weight:700;">{{appName}}</div>
    <div style="padding:32px;color:#343a46;line-height:1.65;font-size:15px;">{{{content}}}</div>
    <div style="padding:16px 32px;text-align:center;color:#9ca3af;font-size:12px;border-top:1px solid #f0f1f4;">
      This is a service message about your account on {{appName}}.<br>{{supportLine}}
    </div>
  </div>
</body>
</html>
