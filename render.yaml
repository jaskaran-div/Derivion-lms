services:
  - type: web
    name: derivion-lms-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://derivion-lms-1.onrender.com
      - key: APP_URL
        value: https://derivion-lms-1.onrender.com
      - key: BACKEND_URL
        value: https://derivion-lms.onrender.com
      - key: DATABASE_URL
        sync: false
      # Session-mode URL (port 5432) used by prisma migrate; DATABASE_URL should be the pooler (6543, ?pgbouncer=true)
      - key: DIRECT_URL
        sync: false
      # Optional: Redis for cache and shared rate limits
      - key: REDIS_URL
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: derivion-lms-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://derivion-lms.onrender.com/api
